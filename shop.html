<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fluffy Shop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav>
        <a href="index.html">Home</a>
        <a href="store.html">Store</a>
        <a href="shop.html">Shop</a>
        <a href="vip.html">VIP</a>
        <a href="admin.html">Admin</a>
      </nav>
      <div class="header-actions">
        <span id="coinBalance">Coins: 0</span>
        <button id="loginBtn">Login</button>
      </div>
    </header>

    <main>
      <section class="card">
        <h1>Shop</h1>
        <p>Buy VIP product for <strong>200 coins</strong>. Then go to the VIP page and enter a valid code.</p>
        <div class="row">
          <div>
            <label for="buyerName">Name</label>
            <input id="buyerName" placeholder="Your name" />
          </div>
          <div>
            <label for="buyerEmail">Email</label>
            <input id="buyerEmail" placeholder="you@example.com" />
          </div>
        </div>
        <button data-buy data-product="VIP" data-cost="200">Buy VIP (200)</button>
        <p id="purchaseStatus"></p>
      </section>
    </main>

    <div id="accountBadge"></div>
    <div class="modal" id="loginModal">
      <div class="card modal-card">
        <h3>Login / Sign up</h3>
        <button id="googleLoginBtn">Login with Google</button>
        <p class="notice">(Demo mode) Google login uses prompts.</p>
        <input id="loginEmail" placeholder="Email" />
        <input id="loginPassword" type="password" placeholder="Password" />
        <button id="loginSubmitBtn">Login</button>
        <input id="signupName" placeholder="Display name" />
        <input id="signupEmail" placeholder="Email" />
        <input id="signupPassword" type="password" placeholder="Password" />
        <button id="signupBtn" class="secondary">Sign up</button>
        <p id="loginMessage"></p>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
